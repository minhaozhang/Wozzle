version: '1.0'
name: release
displayName: Wozzle Release
triggers:
  push:
    tags:
      prefix:
        - v
stages:
  - name: stage-build
    displayName: 构建
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@golang
        name: build-windows
        displayName: Frontend + Windows binaries
        golangVersion: '1.26'
        commands:
          - bash scripts/ci-build.sh
        artifacts:
          - name: WOZZLE_RELEASE
            path:
              - wozzle.exe
              - wozzle-console.exe
              - wozzle-mcp.exe
        caches:
          - /go/pkg/mod
        notify: []
        strategy:
          retry: '0'
  - name: stage-release
    displayName: 发布
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: release@gitee
        name: release-gitee
        displayName: Gitee Release
        releaseName: Wozzle Release
        # 发布说明：改这个文件 + 下面的 tagName，然后打同名 tag 推送
        description: RELEASE_NOTES.md
        tagName: v0.2.2
        upstreamArtifact:
          - WOZZLE_RELEASE
        assertFiles:
          - wozzle.exe
          - wozzle-console.exe
          - wozzle-mcp.exe
        prerelease: false
        allowUpdate: true
        notify: []
        strategy:
          retry: '0'

